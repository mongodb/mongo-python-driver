version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  # Python (uv). Dependabot fully manages uv.lock: one grouped weekly pull
  # request plus immediate, ungrouped security updates. Never set uv's
  # exclude-newer in pyproject.toml instead: Dependabot resolves with it and
  # produces pull requests that remove or downgrade packages
  # (dependabot-core#14156).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      uv:
        patterns:
          - "*"
  # drivers-evergreen-tools submodule
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "drivers-evergreen-tools"
  # Python (pip). Manages requirements/mod_wsgi.txt only; the other
  # requirements files are resolved in uv.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements/aws.txt"
      - "requirements/docs.txt"
      - "requirements/encryption.txt"
      - "requirements/gssapi.txt"
      - "requirements/ocsp.txt"
      - "requirements/snappy.txt"
      - "requirements/test.txt"
      - "requirements/zstd.txt"
