version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  # Python (uv). Routine version updates are handled by the uv-lock-update
  # workflow, so a limit of 0 turns off Dependabot version-update PRs here.
  # Security updates are exempt from this limit and still open normally.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  # drivers-evergreen-tools submodule
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "drivers-evergreen-tools"
  # Python (pip). Manages requirements/mod_wsgi.txt only; the other
  # requirements files are resolved in uv.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "/pyproject.toml"
      - "/requirements.txt"
      - "/requirements/aws.txt"
      - "/requirements/docs.txt"
      - "/requirements/encryption.txt"
      - "/requirements/gssapi.txt"
      - "/requirements/ocsp.txt"
      - "/requirements/snappy.txt"
      - "/requirements/test.txt"
      - "/requirements/zstd.txt"
