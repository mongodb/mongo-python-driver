name: Python Tests

on:
  push:
    branches: ["main", "v**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eux {0}

permissions:
  contents: read

jobs:

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: "3.10"
      # Runs before the install so a stale lock fails in seconds rather than
      # after the build and typecheck.
      - name: Check lockfile is up to date
        run: |
          uv lock --check
      - name: Install Python dependencies
        run: |
          just install
      - name: Run linters
        run: |
          just lint-manual
      - name: Run compilation
        run: |
          export PYMONGO_C_EXT_MUST_BUILD=1
          pip install -v -e .
          python tools/fail_if_no_c.py
      - name: Run typecheck
        run: |
          just typing
      - name: Run synchro smoke test
        run: |
          uv run --extra test --with unasync pytest tools/test_synchro.py -v --override-ini="addopts="
      - name: Validate pyproject.toml
        run: |
          uvx --from 'validate-pyproject[all]' validate-pyproject pyproject.toml
      - name: Check package metadata
        run: |
          uv build
          uvx twine check --strict dist/*
      - run: |
          sudo apt-get install -y cppcheck
      - run: |
          cppcheck --force bson
          cppcheck pymongo

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Tests currently only pass on ubuntu on GitHub Actions.
        os: [ubuntu-latest]
        python-version: ["3.10", "pypy-3.11", "3.13t", "3.15"]
        mongodb-version: ["8.0"]

    name: Python ${{ matrix.python-version }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          # The beta Python here relies on the action's prerelease default.
          python-version: ${{ matrix.python-version }}
      - id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: "${{ matrix.mongodb-version }}"
      - name: Run tests
        run: uv run --extra test pytest -v

  coverage:
    # This enables a coverage report for a given PR, which will be augmented by
    # the combined codecov report uploaded in Evergreen.
    runs-on: ubuntu-latest

    name: Coverage
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: "3.10"
      - id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: "8.0"
      - name: Setup tests
        run: COVERAGE=1 just setup-tests
      - name: Run tests
        run: just run-tests
      - name: Generate xml report
        run: uv tool run --with "coverage[toml]" coverage xml
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  doctest:
    runs-on: ubuntu-latest
    name: DocTest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: just install
      - id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: "8.0"
      - name: Run tests
        run:  |
          just setup-tests doctest
          just run-tests

  mod_wsgi_standalone:
    runs-on: ubuntu-latest
    name: Mod WSGI Standalone
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: versions
        # The versions come from the Evergreen config's version lists.
        run: |
          JSON=$(uv run --no-project --with 'shrub.py>=3.10.0' python .evergreen/scripts/mod_wsgi_matrix.py)
          echo "min-python=$(jq -r '.[0]."python-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "min-mongodb=$(jq -r '.[0]."mongodb-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "max-python=$(jq -r '.[1]."python-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "max-mongodb=$(jq -r '.[1]."mongodb-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
      # Test the newest dependencies on the newest Python and MongoDB, then
      # the minimum dependencies on the oldest supported Python and MongoDB.
      # The min deps test rewrites the lock file, so it runs last.
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: ${{ steps.versions.outputs.max-python }}
      - name: Install Apache
        run: sudo apt-get install -y apache2 apache2-dev
      - name: Install dependencies
        run: |
          # CI skips the venv setup in setup-dev-env.sh, so create it here.
          export PYMONGO_C_EXT_MUST_BUILD=1
          just install
          uv sync --group mod_wsgi --refresh-package pymongo
          uv run --no-sync python tools/fail_if_no_c.py
      - id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: ${{ steps.versions.outputs.max-mongodb }}
          topology: "replica_set"
      - name: Run max deps tests
        # Call the test scripts directly: the just recipes run "uv sync",
        # which would drop the mod_wsgi group before teardown can stop Apache.
        run: |
          bash .evergreen/scripts/setup-tests.sh mod_wsgi standalone
          bash .evergreen/run-tests.sh
      - name: Teardown
        if: always()
        run: bash .evergreen/scripts/teardown-tests.sh
      - name: Install min Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: ${{ steps.versions.outputs.min-python }}
      - name: Rebuild virtual environment
        run: |
          rm -rf .venv
          export PYMONGO_C_EXT_MUST_BUILD=1
          uv sync --group mod_wsgi --refresh-package pymongo
          uv run --no-sync python tools/fail_if_no_c.py
      - id: setup-mongodb-min
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: ${{ steps.versions.outputs.min-mongodb }}
          topology: "replica_set"
      - name: Run min deps tests
        env:
          TEST_MIN_DEPS: "1"
        run: |
          bash .evergreen/scripts/setup-tests.sh mod_wsgi standalone
          bash .evergreen/run-tests.sh
      - name: Teardown min
        if: always()
        run: bash .evergreen/scripts/teardown-tests.sh

  mod_wsgi_embedded:
    runs-on: ubuntu-latest
    name: Mod WSGI Embedded
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: versions
        # The versions come from the Evergreen config's version lists.
        run: |
          JSON=$(uv run --no-project --with 'shrub.py>=3.10.0' python .evergreen/scripts/mod_wsgi_matrix.py)
          echo "min-python=$(jq -r '.[0]."python-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "min-mongodb=$(jq -r '.[0]."mongodb-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "max-python=$(jq -r '.[1]."python-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "max-mongodb=$(jq -r '.[1]."mongodb-version"' <<<"$JSON")" >> "$GITHUB_OUTPUT"
      # Test the newest dependencies on the newest Python and MongoDB, then
      # the minimum dependencies on the oldest supported Python and MongoDB.
      # The min deps test rewrites the lock file, so it runs last.
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: ${{ steps.versions.outputs.max-python }}
      - name: Install Apache
        run: sudo apt-get install -y apache2 apache2-dev
      - name: Install dependencies
        run: |
          # CI skips the venv setup in setup-dev-env.sh, so create it here.
          export PYMONGO_C_EXT_MUST_BUILD=1
          just install
          uv sync --group mod_wsgi --refresh-package pymongo
          uv run --no-sync python tools/fail_if_no_c.py
      - id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: ${{ steps.versions.outputs.max-mongodb }}
          topology: "replica_set"
      - name: Run max deps tests
        # Call the test scripts directly: the just recipes run "uv sync",
        # which would drop the mod_wsgi group before teardown can stop Apache.
        run: |
          bash .evergreen/scripts/setup-tests.sh mod_wsgi embedded
          bash .evergreen/run-tests.sh
      - name: Teardown
        if: always()
        run: bash .evergreen/scripts/teardown-tests.sh
      - name: Install min Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: ${{ steps.versions.outputs.min-python }}
      - name: Rebuild virtual environment
        run: |
          rm -rf .venv
          export PYMONGO_C_EXT_MUST_BUILD=1
          uv sync --group mod_wsgi --refresh-package pymongo
          uv run --no-sync python tools/fail_if_no_c.py
      - id: setup-mongodb-min
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: ${{ steps.versions.outputs.min-mongodb }}
          topology: "replica_set"
      - name: Run min deps tests
        env:
          TEST_MIN_DEPS: "1"
        run: |
          bash .evergreen/scripts/setup-tests.sh mod_wsgi embedded
          bash .evergreen/run-tests.sh
      - name: Teardown min
        if: always()
        run: bash .evergreen/scripts/teardown-tests.sh

  docs:
    name: Docs Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: just install
      - name: Build docs
        run: just docs

  typing:
    name: Typing Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: "${{matrix.python}}"
      - name: Install dependencies
        run: just install
      - name: Run typecheck
        run: |
          just typing

  integration_tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Python tooling
        uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: just install
      - id: setup-mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
      - name: Run tests
        run:  |
          just integration-tests
      - id: setup-mongodb-ssl
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          ssl: true
      - name: Run tests
        run: |
          just integration-tests

  make_sdist:
    runs-on: ubuntu-latest
    name: "Make an sdist"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
          # Build sdist on lowest supported Python
          python-version: "3.9"
      - name: Build SDist
        shell: bash
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: "sdist"
          path: dist/*.tar.gz

  test_sdist:
      runs-on: ubuntu-latest
      needs: [make_sdist]
      name: Install from SDist and Test
      timeout-minutes: 20
      steps:
        - name: Download sdist
          uses: actions/download-artifact@v8
          with:
            path: sdist/
        - name: Unpack SDist
          shell: bash
          run: |
            cd sdist
            ls
            mkdir test
            tar --strip-components=1 -zxf *.tar.gz -C ./test
            ls test
        - uses: actions/setup-python@v7.0.0
          with:
            cache: 'pip'
            cache-dependency-path: 'sdist/test/pyproject.toml'
            # Test sdist on lowest supported Python
            python-version: "3.9"
        - id: setup-mongodb
          uses: mongodb-labs/drivers-evergreen-tools@master
        - name: Run connect test from sdist
          shell: bash
          run: |
            cd sdist/test
            ls
            which python
            pip install -e ".[test]"
            PYMONGO_MUST_CONNECT=1 pytest -v -k client_context

  test_minimum:
      permissions:
        contents: read
      runs-on: ubuntu-latest
      name: Test minimum dependencies and Python
      steps:
        - uses: actions/checkout@v7.0.1
          with:
            persist-credentials: false
        - name: Install Python tooling
          uses: mongodb-labs/drivers-github-tools/python/setup@1a2d86bd5fed4b0090453bcd510e4c2ba3b92356  # v3.0.4
          with:
            python-version: "3.9"
        - id: setup-mongodb
          uses: mongodb-labs/drivers-evergreen-tools@master
          with:
            version: "8.0"
        - name: Run tests
          shell: bash
          run: |
            uv venv
            source .venv/bin/activate
            uv pip install -e ".[test]" --resolution=lowest-direct --force-reinstall
            pytest -v test/test_srv_polling.py test/test_dns.py test/asynchronous/test_srv_polling.py test/asynchronous/test_dns.py
