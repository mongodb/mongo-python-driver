# This is a minimal httpd.conf file written for Apache 2.4 on Fedora/RHEL.

# The modules directory is here on Fedora/RHEL.
ServerRoot "/etc/httpd"
DefaultRuntimeDir ${PWD}

DocumentRoot ${PWD}
PidFile ${PWD}/httpd.pid

# Bind to localhost only, don't require sudo.
Listen 127.0.0.1:8080

# Required modules.
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
# Loaded before any mod_wsgi directive below.
LoadModule wsgi_module ${MOD_WSGI_SO}

# mod_wsgi is built against the interpreter used to install it. When Apache is
# started by a different executable than that interpreter, the embedded Python
# cannot locate its standard library, so point it at the installation.
WSGIPythonHome "${MOD_WSGI_PYTHON_HOME}"

# Bound the number of worker processes. mod_wsgi embedded mode loads a full
# Python interpreter and PyMongo in every worker, so the parallel test's
# concurrent requests would otherwise ramp prefork up to its default
# MaxRequestWorkers (256) and exhaust the container's memory.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 16
    MaxRequestWorkers 16
    MaxConnectionsPerChild 0
</IfModule>

ServerName localhost

ErrorLog ${PWD}/error_log
CustomLog ${PWD}/access_log combined

# Apache must not run as root. The httpd package creates this user.
User apache
Group apache

<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

<Directory ${PWD}>
    AllowOverride None
    Require all granted
</Directory>

Include ${PROJECT_DIRECTORY}/test/mod_wsgi_test/${MOD_WSGI_CONF}
