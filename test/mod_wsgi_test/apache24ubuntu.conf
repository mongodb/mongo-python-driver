# This is a minimal httpd.conf file written for Apache 2.4 on Ubuntu.

# The modules directory is here on Ubuntu.
ServerRoot "/usr/lib/apache2"

# mod_wsgi 6 destroys the interpreter as child processes exit. pymongo shuts
# its monitor threads down during interpreter finalization, so the default
# lifecycle (WSGIDestroyInterpreter On) is safe to use.
DocumentRoot ${PWD}
PidFile ${PWD}/apache2.pid

# Bind to localhost only, don't require sudo.
Listen 127.0.0.1:8080

# Required modules.
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
# Loaded before the mod_wsgi directives in the included test config.
LoadModule wsgi_module ${MOD_WSGI_SO}

# Bound the number of worker processes. mod_wsgi embedded mode loads a full
# Python interpreter and PyMongo in every worker, so the parallel test's
# concurrent requests would otherwise ramp prefork up to its default
# MaxRequestWorkers (256) and exhaust the container's memory.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 16
    MaxRequestWorkers 16
    MaxConnectionsPerChild 0
</IfModule>

ErrorLog ${PWD}/error_log
CustomLog ${PWD}/access_log combined

<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

<Directory ${PWD}>
    AllowOverride None
    Require all granted
</Directory>

Include ${PROJECT_DIRECTORY}/test/mod_wsgi_test/${MOD_WSGI_CONF}
