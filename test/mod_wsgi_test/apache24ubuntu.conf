# This is a minimal httpd.conf file written for Apache 2.4 on Ubuntu.

# The modules directory is here on Ubuntu.
ServerRoot "/usr/lib/apache2"

# mod_wsgi 6 deletes thread states of still-running threads when it destroys
# interpreters as child processes exit, which crashes pymongo monitor threads.
# Keep the mod_wsgi 4 lifecycle where child processes do not finalize Python.
WSGIDestroyInterpreter Off
DocumentRoot ${PWD}
PidFile ${PWD}/apache2.pid

# Bind to localhost only, don't require sudo.
Listen 127.0.0.1:8080

# Required modules.
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so

ErrorLog ${PWD}/error_log
CustomLog ${PWD}/access_log combined

<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

<Directory ${PWD}>
    AllowOverride None
    Require all granted
</Directory>

Include ${PROJECT_DIRECTORY}/test/mod_wsgi_test/${MOD_WSGI_CONF}
