[package]
name = "pymongo-rbson"
version = "0.1.0"
edition = "2021"
description = "Rust-backed BSON codec for PyMongo (drop-in alternative to bson._cbson)"

[lib]
name = "_rbson"
crate-type = ["cdylib"]

[dependencies]
memchr = "2.8.3"
pyo3 = { version = "0.29", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
