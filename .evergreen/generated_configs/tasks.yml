          AUTH: noauth
          SSL: nossl
          TOPOLOGY: standalone
      - func: run tests
        vars:
          AUTH: noauth
          SSL: nossl
          TOPOLOGY: standalone
          TEST_NAME: default_sync
    tags: [test-no-toolchain, standalone-noauth-nossl]
  - name: test-no-toolchain-async-noauth-ssl-replica-set
