      - func: run server
      - func: run tests
        vars:
          UV_PYTHON: "3.11"
          AUTH: auth
          SSL: ssl
          TOPOLOGY: sharded_cluster
    tags: [test-min-support]

  # No orchestration tests
  - name: test-no-orchestration-python3.11-min-deps
    commands:
      - func: assume ec2 role
      - func: run tests
        vars:
          UV_PYTHON: "3.11"
          TEST_MIN_DEPS: "1"
    tags: [test-no-orchestration, python-3.11]
  - name: test-no-orchestration-python3.15
    commands:
      - func: assume ec2 role
      - func: run tests
        vars:
          UV_PYTHON: "3.15"
    tags: [test-no-orchestration, python-3.15]

  # No toolchain tests
  - name: test-no-toolchain-sync-noauth-nossl-standalone
