          VERSION: "8.0"
      - func: run tests
        vars:
          TEST_NAME: auth_aws
          SUB_TEST_NAME: ecs
    tags: [auth-aws-ecs]

  # Backport pr tests
  - name: backport-pr
    commands:
      - func: assume ec2 role
      - command: subprocess.exec
        params:
          binary: bash
          args:
            - ${DRIVERS_TOOLS}/.evergreen/github_app/backport-pr.sh
            - mongodb
            - mongo-python-driver
            - ${github_commit}
          working_dir: src
          include_expansions_in_env:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN
        type: test

  # Coverage report tests
  - name: coverage-report
    commands:
      - func: download and merge coverage
    depends_on: [{ name: .server-version, variant: .coverage_tag, status: "*", patch_optional: true }]
    tags: [coverage, pr]

  # Getdata tests
  - name: getdata
    commands:
      - command: subprocess.exec
        params:
          binary: bash
          args:
            - .evergreen/scripts/run-getdata.sh
          working_dir: src
        type: test

  # Import time tests
  - name: check-import-time
    commands:
      - command: subprocess.exec
        params:
          binary: bash
          args:
            - .evergreen/scripts/check-import-time.sh
            - ${revision}
            - ${github_commit}
          working_dir: src
        type: test
    tags: [pr]

  # Kms tests
  - name: test-gcpkms
    commands:
      - func: run tests
        vars:
          TEST_NAME: kms
          SUB_TEST_NAME: gcp
    tags: []
  - name: test-gcpkms-fail
    commands:
