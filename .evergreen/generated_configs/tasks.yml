  - name: test-min-support-python3.11-standalone-noauth-nossl
    commands:
      - func: run server
      - func: run tests
        vars:
          UV_PYTHON: "3.11"
          AUTH: noauth
          SSL: nossl
          TOPOLOGY: standalone
    tags: [test-min-support]
  - name: test-min-support-python3.11-replica-set-noauth-ssl
    commands:
      - func: run server
      - func: run tests
        vars:
          UV_PYTHON: "3.11"
          AUTH: noauth
          SSL: ssl
          TOPOLOGY: replica_set
    tags: [test-min-support]
  - name: test-min-support-python3.11-sharded-cluster-auth-ssl
