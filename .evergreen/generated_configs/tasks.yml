tasks:
  # Aws lambda tests
  - name: test-aws-lambda-deployed
    commands:
      - func: assume ec2 role
      - func: run tests
        vars:
          TEST_NAME: aws_lambda
    tags: [aws_lambda]

  # Aws tests
  - name: test-auth-aws-4.4-regular-python3.11-min-deps
    commands:
      - func: run server
        vars:
          AUTH_AWS: "1"
          VERSION: "4.4"
      - func: assume ec2 role
      - func: run tests
        vars:
          TEST_NAME: auth_aws
          SUB_TEST_NAME: regular
          UV_PYTHON: "3.11"
          TEST_MIN_DEPS: "1"
    tags: [auth-aws, auth-aws-regular]
  - name: test-auth-aws-5.0-assume-role-python3.12
