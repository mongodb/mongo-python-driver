########################################
# Evergreen Template for MongoDB Drivers
########################################

# When a task that used to pass starts to fail
# Go through all versions that may have been skipped to detect
# when the task started failing
stepback: true

# Mark a failure as a system/bootstrap failure (purple box) rather then a task
# failure by default.
# Actual testing tasks are marked with `type: test`
command_type: system

# Protect ourselves against rogue test case, or curl gone wild, that runs forever
# Good rule of thumb: the averageish length a task takes, times 5
# That roughly accounts for variable system performance for various buildvariants
exec_timeout_secs: 3600 # 60 minutes is the longest we'll ever run (primarily
                        # for macos hosts)

# What to do when evergreen hits the timeout (`post:` tasks are run automatically)
timeout:
  - command: subprocess.exec
    params:
      binary: ls -la

include:
  - filename: .evergreen/generated_configs/functions.yml
  - filename: .evergreen/generated_configs/tasks.yml
  - filename: .evergreen/generated_configs/variants.yml

pre:
  - func: "fetch source"
  - func: "setup system"
  - func: "assume ec2 role"

post:
  # Disabled, causing timeouts
  # - func: "upload working dir"
  - func: "teardown system"
  - func: "upload codecov"
  - func: "upload coverage"
  - func: "upload mo artifacts"
  - func: "upload test results"
  - func: "cleanup"

tasks:
  - name: test-socks5-prose-noauth-nossl
    tags: [pr]
    commands:
      - func: run server
        vars:
          TEST_NAME: default
          VERSION: "8.0"
          TOPOLOGY: replica_set
          AUTH: noauth
          SSL: nossl
      - command: subprocess.exec
        type: test
        params:
          binary: python3
          args:
            - .evergreen/scripts/run_socks5_proxy.py
            - --port
            - "1080"
            - --auth
            - username:p4ssw0rd
          background: true
          working_dir: src
          include_expansions_in_env:
            - MONGODB_URI
            - DRIVERS_TOOLS
      - command: subprocess.exec
        type: test
        params:
          binary: python3
          args:
            - .evergreen/scripts/run_socks5_proxy.py
            - --port
            - "1081"
          background: true
          working_dir: src
          include_expansions_in_env:
            - MONGODB_URI
            - DRIVERS_TOOLS
      - command: subprocess.exec
        type: test
        params:
          binary: bash
          args:
            - .evergreen/just.sh
            - setup-tests
            - default
          working_dir: src
          include_expansions_in_env:
            - AUTH
            - SSL
            - MONGODB_URI
            - UV_PYTHON
      - command: subprocess.exec
        type: test
        params:
          binary: bash
          args:
            - .evergreen/just.sh
            - run-tests
            - test/test_socks5.py
            - test/asynchronous/test_socks5.py
            - -k
            - TestSocks5Prose
          working_dir: src
          include_expansions_in_env:
            - SOCKS5_PROXIES_STARTED
            - MONGODB_URI

  - name: test-socks5-prose-noauth-ssl
    tags: [pr]
    commands:
      - func: run server
        vars:
          TEST_NAME: default
          VERSION: "8.0"
          TOPOLOGY: replica_set
          AUTH: noauth
          SSL: ssl
      - command: subprocess.exec
        type: test
        params:
          binary: python3
          args:
            - .evergreen/scripts/run_socks5_proxy.py
            - --port
            - "1080"
            - --auth
            - username:p4ssw0rd
          background: true
          working_dir: src
          include_expansions_in_env:
            - MONGODB_URI
            - DRIVERS_TOOLS
      - command: subprocess.exec
        type: test
        params:
          binary: python3
          args:
            - .evergreen/scripts/run_socks5_proxy.py
            - --port
            - "1081"
          background: true
          working_dir: src
          include_expansions_in_env:
            - MONGODB_URI
            - DRIVERS_TOOLS
      - command: subprocess.exec
        type: test
        params:
          binary: bash
          args:
            - .evergreen/just.sh
            - setup-tests
            - default
          working_dir: src
          include_expansions_in_env:
            - AUTH
            - SSL
            - MONGODB_URI
            - UV_PYTHON
      - command: subprocess.exec
        type: test
        params:
          binary: bash
          args:
            - .evergreen/just.sh
            - run-tests
            - test/test_socks5.py
            - test/asynchronous/test_socks5.py
            - -k
            - TestSocks5Prose
          working_dir: src
          include_expansions_in_env:
            - SOCKS5_PROXIES_STARTED
            - MONGODB_URI

  - name: linkcheck
    commands:
      - command: subprocess.exec
        type: test
        params:
          binary: bash
          args:
            - .evergreen/just.sh
            - docs-linkcheck
          working_dir: src

  - name: resync_specs
    commands:
      - command: subprocess.exec
        params:
          binary: bash
          include_expansions_in_env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN]
          args:
            - .evergreen/scripts/resync-all-specs.sh
          working_dir: src

buildvariants:
  - name: linkcheck
    display_name: "Link Check"
    run_on: rhel80-small
    cron: '0 0 * * *'
    patchable: true
    tasks:
      - name: linkcheck

  - name: resync_specs
    display_name: "Resync Specs"
    run_on: rhel80-small
    cron: '0 16 * * MON'
    patchable: true
    tasks:
      - name: resync_specs

  - name: socks5-prose
    display_name: "SOCKS5 Prose Tests"
    run_on: rhel8.10-small
    patchable: true
    tags: [pr]
    expansions:
      SOCKS5_PROXIES_STARTED: "1"
      UV_PYTHON: "3.11"
    tasks:
      - name: test-socks5-prose-noauth-nossl
      - name: test-socks5-prose-noauth-ssl
